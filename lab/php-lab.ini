; CVE-2026-129496: file error_log plus invalid timezone allocates tzcache on the startup heap.
date.timezone = Not/AZone
log_errors = 1
error_log = /var/log/php-error.log
display_errors = 0
memory_limit = 2M
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 1000
max_input_nesting_level = 64
enable_post_data_reading = 1
expose_php = 0
opcache.enable = 0
output_buffering = 0
